<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1a22">
<title>محمّل الوسائط</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>محمّل الوسائط</h1>
    <p class="lead">الصق رابط الفيديو أو شاركه من أي تطبيق، واختر الصيغة التي تناسب جهازك.</p>
  </header>

  <form id="bar" class="bar" autocomplete="off">
    <label class="sr" for="url">رابط الفيديو</label>
    <input id="url" type="text" inputmode="url" dir="ltr" placeholder="https://youtu.be/…" enterkeyhint="search">
    <button id="go" type="submit" class="primary">جلب الصيغ</button>
  </form>

  <section id="res" aria-live="polite"></section>
  <section id="saved" class="saved" hidden>
    <div class="saved-head">
      <h2>المحفوظ على هذا الجهاز</h2>
      <p id="meter-text" class="muted"></p>
    </div>
    <div class="meter" role="progressbar" aria-label="المساحة المستخدمة" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="meter"></i></div>
    <ul id="saved-list"></ul>
  </section>
  <section id="recents" class="recents" hidden>
    <h2>آخر الروابط</h2>
    <ul id="recent-list"></ul>
  </section>
  <p class="foot">للاستخدام الشخصي فقط. تأكد من حقك في تنزيل المحتوى وحفظه.</p>
</main>
<script src="/static/ledger.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
