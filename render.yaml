services:
  - type: web
    name: ytdlp-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: COOKIES_B64
        sync: false
      - key: ENABLE_POT
        value: "1"
      - key: AUTO_UPDATE
        value: "0"
      - key: WEB_PUBLIC
        value: "1"
      - key: MAX_CONCURRENT
        value: "1"
      - key: MAX_DOWNLOADS
        value: "4"
      - key: THREADS
        value: "8"
      - key: MAX_REQUESTS
        value: "300"
